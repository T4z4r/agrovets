name: apex
description: Apex Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
   flutter:
     sdk: flutter
   flutter_localizations:
     sdk: flutter
   http: ^1.2.0
   shared_preferences: ^2.2.2
   provider: ^6.1.1
   intl: ^0.19.0
   url_launcher: ^6.2.4
   path_provider: ^2.1.1
   open_file: ^3.3.2
   syncfusion_flutter_pdfviewer: ^24.2.9  # for viewing PDF receipts
   flutter_spinkit: ^5.1.0
   mobile_scanner: ^3.5.6
   permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"


flutter:
  uses-material-design: true
  generate: true
assets:
    - assets/images/
    - assets/logo.png
    - assets/images/logo.png
    